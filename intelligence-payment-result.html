<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>

    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '4423542734591767');

  <style>
    :root{--navy:#071321;--navy2:#0d1c31;--blue:#347df1;--yellow:#f5c95e;--white:#f7f9fc;--muted:#93a4b8;--line:rgba(255,255,255,.12);--green:#5bd4a3;--red:#ff7d74;--sans:"Inter",system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 12%,rgba(52,125,241,.18),transparent 28%),linear-gradient(145deg,var(--navy2),var(--navy));color:var(--white);font-family:var(--sans);display:grid;place-items:center;padding:24px}.card{width:min(760px,100%);border:1px solid var(--line);background:rgba(7,19,33,.86);box-shadow:0 36px 100px rgba(0,0,0,.38);padding:clamp(28px,5vw,58px);position:relative;overflow:hidden}.card:before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:var(--blue);filter:blur(90px);opacity:.13;right:-80px;top:-100px}.eyebrow{display:inline-flex;padding:8px 13px;border-radius:999px;background:var(--blue);font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}h1{font-size:clamp(38px,7vw,68px);line-height:.98;letter-spacing:-.04em;margin:24px 0 0;max-width:650px}p{font-size:17px;line-height:1.7;color:var(--muted);margin:20px 0 0;max-width:620px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.btn{min-height:56px;padding:16px 22px;border:1px solid var(--blue);background:var(--blue);color:#fff;font:inherit;font-size:13px;font-weight:900;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.btn.secondary{background:transparent;border-color:var(--line);color:var(--white)}.status{margin-top:26px;padding:17px 18px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);font-size:13px;line-height:1.55}.success{color:var(--green);font-weight:800}.error{color:var(--red);font-weight:800}.price-chip{display:inline-flex;align-items:center;gap:9px;margin-top:22px;color:var(--yellow);font-weight:800;font-size:13px}.price-chip:before{content:"";width:8px;height:8px;background:var(--yellow);border-radius:50%}@media(max-width:560px){body{padding:12px}.card{padding:28px 22px}.actions,.btn{width:100%}}
  </style>
</head>
<body>
  <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=4423542734591767&ev=PageView&noscript=1" alt=""></noscript>
  <main class="card">
    <span class="eyebrow">Marbella Ad Intelligence</span>
    <h1 id="title">Checking your payment...</h1>
    <p id="message">Please wait while the transaction is confirmed.</p>
    <div class="price-chip">One-time purchase · $49</div>
    <div class="actions" id="actions">
      <button class="btn secondary" type="button" id="checkAgainBtn">Check again</button>
      <a class="btn secondary" href="/">Back to RealAdBook</a>
    </div>
    <div class="status" id="statusBox">Loading...</div>
  </main>

  <script>
    const titleEl=document.getElementById('title');
    const messageEl=document.getElementById('message');
    const actionsEl=document.getElementById('actions');
    const statusBox=document.getElementById('statusBox');
    const checkAgainBtn=document.getElementById('checkAgainBtn');

    function getInvoiceId(){const p=new URLSearchParams(location.search);return p.get('invoiceId')||localStorage.getItem('monoLastIntelligenceInvoiceId')||''}
    function tracked(id){try{return localStorage.getItem(`intelPurchaseTracked:${id}`)==='1'}catch{return false}}
    function markTracked(id){try{localStorage.setItem(`intelPurchaseTracked:${id}`,'1')}catch{}}
    function trackPurchase(data){const id=data.invoiceId||getInvoiceId();if(!id||typeof window.fbq!=='function'||tracked(id))return;window.fbq('track','Purchase',{value:49,currency:'USD',content_name:'Marbella Real Estate Ad Intelligence',content_ids:['marbella-ad-intelligence'],content_type:'product'},{eventID:`purchase_intel_${id}`});markTracked(id)}

    function renderNoInvoice(){titleEl.textContent='We could not find your payment';messageEl.textContent='Return to the report offer and start checkout again. If you already paid, contact support with your payment details.';statusBox.innerHTML='<span class="error">No invoice was found in this browser.</span>';actionsEl.innerHTML='<a class="btn" href="/marbella-thank-you">Return to the offer</a><a class="btn secondary" href="/">Back to RealAdBook</a>'}
    function renderSuccess(data){const id=encodeURIComponent(data.invoiceId||getInvoiceId());titleEl.textContent='Your report is ready';messageEl.textContent='Payment confirmed. Download the Marbella Real Estate Ad Intelligence report below.';trackPurchase(data);actionsEl.innerHTML=`<a class="btn" href="/api/download-intelligence?invoiceId=${id}">Download the report</a><a class="btn secondary" href="/">Back to RealAdBook</a>`;statusBox.innerHTML='<span class="success">Payment confirmed.</span> Your private download is unlocked.'}
    function renderProcessing(data){titleEl.textContent='Payment is still processing';messageEl.textContent='The payment has not been confirmed yet. Wait a few seconds and check again.';statusBox.textContent=`Current status: ${data.status||'processing'}.`}
    function renderFailed(data){titleEl.textContent='Payment was not completed';messageEl.textContent='The payment failed, expired, or was not completed. You can return to the offer and try again.';actionsEl.innerHTML='<a class="btn" href="/marbella-thank-you">Try again</a><a class="btn secondary" href="/">Back to RealAdBook</a>';statusBox.innerHTML=`<span class="error">Payment not confirmed.</span>${data.failureReason?` ${data.failureReason}`:''}`}

    async function checkStatus(){const invoiceId=getInvoiceId();if(!invoiceId){renderNoInvoice();return}titleEl.textContent='Checking your payment...';messageEl.textContent='Please wait while the transaction is confirmed.';statusBox.textContent='Loading...';try{const r=await fetch(`/api/invoice-status?invoiceId=${encodeURIComponent(invoiceId)}`);const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Could not check payment status.');if(d.status==='success')return renderSuccess(d);if(['created','processing','hold'].includes(d.status))return renderProcessing(d);renderFailed(d)}catch(e){titleEl.textContent='Could not verify payment';messageEl.textContent='Something went wrong while checking the transaction. Try again in a few seconds.';statusBox.innerHTML=`<span class="error">${e.message}</span>`}}
    checkAgainBtn.addEventListener('click',checkStatus);checkStatus();
  </script>
</body>
</html>
